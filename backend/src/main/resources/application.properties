spring.application.name=inventory-management-system

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/inventorydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Server ---
server.port=8080

# --- JWT ---
# Override this in production via an environment variable, e.g. APP_JWT_SECRET
app.jwt.secret=${APP_JWT_SECRET:change-this-dev-secret-to-something-long-and-random}
app.jwt.expiration-ms=86400000

# --- OpenAPI / Swagger UI at /swagger-ui/index.html ---
springdoc.swagger-ui.path=/swagger-ui.html
